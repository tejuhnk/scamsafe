services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  ml-service:
    build: ./services/ml
    restart: unless-stopped
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/scamsafe
      ML_SERVICE_URL: http://ml-service:8000
      # Local-only default. Set JWT_SECRET in .env before deploying.
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      FRONTEND_URL: http://localhost:8080
    depends_on:
      - mongodb
      - ml-service
  web:
    build: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  mongo-data:
